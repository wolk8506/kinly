<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Kinly</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body.booting {
        overflow: hidden;
        background: radial-gradient(1200px 600px at 20% 20%, rgba(49, 84, 255, 0.18), transparent 55%),
          radial-gradient(900px 600px at 80% 70%, rgba(0, 219, 176, 0.13), transparent 60%),
          linear-gradient(160deg, #05070d 0%, #0b1021 45%, #06080f 100%);
        color: #f4f7ff;
        font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 9999;
        transition: opacity 220ms ease;
      }

      #boot-splash.hide {
        opacity: 0;
        pointer-events: none;
      }

      .boot-visual {
        width: 220px;
        height: 220px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }

      /* Спицы iOS-спиннера неподвижны: по ним бежит волна прозрачности —
         у каждой спицы своя фаза анимации (animation-delay), как в
         UIActivityIndicatorView. */
      .boot-spinner {
        width: 44px;
        height: 44px;
        flex-shrink: 0;
      }

      .boot-spinner circle {
        animation: boot-wave 1.2s ease-in-out infinite;
      }

      @keyframes boot-wave {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 1; }
      }

      .boot-logo {
        width: 148px;
        height: 148px;
        /* border-radius: 20px; */
        object-fit: contain;
        /* background: rgba(4, 8, 19, 0.85); */
        /* border: 1px solid rgba(255, 255, 255, 0.12); */
        /* box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); */
      }

    </style>
  </head>
  <body class="booting">
    <div id="boot-splash">
      <div>
        <div class="boot-visual">
          <img class="boot-logo" src="./build/icons/icon.png" alt="Kinly" />
          <svg class="boot-spinner" viewBox="0 0 100 100" aria-hidden="true">
            <!-- 12 спиц-«пилюль» на радиусе ~42 от центра, длинная ось по
                 касательной (вертикальная линия справа = касательная в точке 3 часа).
                 opacity — градиент бегущей волны, как в UIActivityIndicatorView -->
            <g>
            <circle fill="#7f9cff" cx="92" cy="50" r="4" style="animation-delay:-1.1s" />
            <circle fill="#78a7f5" cx="92" cy="50" r="4" transform="rotate(30 50 50)" style="animation-delay:-1.0s" />
            <circle fill="#71b2ec" cx="92" cy="50" r="4" transform="rotate(60 50 50)" style="animation-delay:-0.9s" />
            <circle fill="#6abde2" cx="92" cy="50" r="4" transform="rotate(90 50 50)" style="animation-delay:-0.8s" />
            <circle fill="#63c8d9" cx="92" cy="50" r="4" transform="rotate(120 50 50)" style="animation-delay:-0.7s" />
            <circle fill="#5bd3cf" cx="92" cy="50" r="4" transform="rotate(150 50 50)" style="animation-delay:-0.6s" />
            <circle fill="#54ddc5" cx="92" cy="50" r="4" transform="rotate(180 50 50)" style="animation-delay:-0.5s" />
            <circle fill="#5cd1d0" cx="92" cy="50" r="4" transform="rotate(210 50 50)" style="animation-delay:-0.4s" />
            <circle fill="#65c4dc" cx="92" cy="50" r="4" transform="rotate(240 50 50)" style="animation-delay:-0.3s" />
            <circle fill="#6eb7e8" cx="92" cy="50" r="4" transform="rotate(270 50 50)" style="animation-delay:-0.2s" />
            <circle fill="#76a9f3" cx="92" cy="50" r="4" transform="rotate(300 50 50)" style="animation-delay:-0.1s" />
            <circle fill="#7f9cff" cx="92" cy="50" r="4" transform="rotate(330 50 50)" style="animation-delay:0s" />
            </g>
          </svg>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
